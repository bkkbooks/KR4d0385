body:
  text: 北逰集别集類三宋提要臣等謹案北遊集二巻宋汪夢斗撰夢斗號杏山績溪人景定間以明經發解江東漕試授承節郎江東司制幹官咸淳初遷史館編校與葉李等議上書劾丞相賈似道李等坐罪夢斗亦遁歸宋亡後尚書謝昌言薦夢斗於元世祖特召赴京卒不受官放還是集乃其北逰紀行之作中有見謝尚書詩云正須自愛不貲身盖不特律己甚嚴即其以道義規昌言亦可謂婉而嚴矣惟是上故相留公詩註謂公入朝不屈稱前正奉大夫攷夢炎以徳祐二年降元時為世祖所鄙又曾勸殺文天祥安得有入朝不屈之事集中又有南園歌為呉潜竄循州而作詩末附数語云履翁再相力言奸邪誤國数事理皇竟不能平會似道以江上肅清之報徑達禁中上遂罷潛相明曰乃以似道奏付外考宋史似道江上肅清之奏在理宗景定元年三月乙酉之前呉潛之罷在是年四月己酉若如夢斗言是于己酉之明日始以似道奏付外則上距四月乙酉前將及一月是時朝野方以荆鄂為竒功乃捷書到禁中一月始布於外與情勢尤有未合或其後人掇拾遺稿不免以贋本竄入未及致詳耶又杏山摭稿数條乃後人所集夢斗講學之語原附集末今亦仍之焉乾隆四十六年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀北遊集原序右詩凡若干篇合為一編曰北遊集是嵗己卯春正月戊辰如京冬十月丙申歸里舟車幾行萬里客食二百七十日自呉適楚入宋入魯入齊入趙以達於燕出揚歴徐歴青歴兖歴豫歴冀乃至幽由江南經淮南河南以趨河北識太行常山渡江渡淮渡濟蓋禹貢九州所履者六星紀十二分所經者七唐十道行者四五嶽見其二四瀆雖不曾渡河亦涉其流可謂北遊也已天時之寒燠地里之險易人情之媺惡物産之豐儉風俗之醇駁雖不能盡知有所知隨而筆之目為北遊日誌至於悲傷懐感憂懼愁嘆不能自己又每見之詩與夫見人以詩為贄以及白事述志皆不能無詩初亦雜録之誌中或謂冗長不雅觀因别為此集亦目為北遊非無意也余生於南自少至長冉冉老矣而未嘗得至於南之極岷峨在吾輿圖而生平未嘗西行東至雲間見海矣自以為東之極今天下東必至登萊才為極足亦未至而北乃直至秦長城下則此遊可以為北之極且以余有生時言之北至淮極矣借得在全宋盛時北亦止極白溝耳今踰淮又踰白溝信乎此遊為北之極也吁其亦可喜也夫其亦可悲也夫集中題意未盡者與日誌參考乃可互見新安汪夢斗序
