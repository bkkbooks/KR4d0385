body:
  text: 北遊集巻上宋汪夢斗撰詩旌徳道中即事天氣才晴便不同輕輕拂面有和風溪邊春事關心處楊柳深青杏淺紅涇縣琴臺石臺突兀倚晴空一帶春江瀉玉虹千古佳名喚行客騎魚何處訪琴公當途道中社鵲信占新霽朝暾起樹東春衫欺客冷社甕憶鄉紅溪長杏花水路蒸蘭草風午飱羮枸杞扶弱有神功過江陵鎮登秦申王墳讀决策元功精忠粹徳碑文有感近事而賦力成和議得休兵痛罵猶煩諸老生拘執行人招覆滅幸逃誅死罰殊輕金陵上王煥卿提刑英蕩觀風下帝旁六條察吏立臺霜中原自古聞王猛一道而今有范滂園館日和歸燕樂江城春透露桃香公餘無限離騷興故許吟人拜下牀奥屯周卿提刑去年巡歴績溪囘日有詩留别今依韻和呈皇華曾為歙山留笑殺揚人汎汎舟偶話後天非定位懸知此輩固清流一燈雪屋蟲聲細疋馬晴川草色秋倚杖儒宫橋下水夢魂須憶舊來遊金陵僦舟渡江至儀真登陸舟中口占六首風冷知日落水寛得天多金陵懐古句絶唱是西河寒波白似面逺岫劣於眉江上無多作淮南正要詩事以詩書立國惟仁義昌當年衣帶水元不管興亡舟人忽驚問春事已平分江水浸鈎月晴空横疋雲風順㠶心飽潮平櫂尾收擁書人自卧一息到真州天圍春漲濶水展夕陽紅己是淮南客常吟江左風清眀他鄉逢冷食故國隔長江薄雨膏猶膩落紅香滿腔客遊如夢醒愁事被春降正説揚州鶴俄來雪一雙枕上漫成偶涉長江向北來時寒江北較花遲一春十日九風雨百嵗半生多别離佛刹疎鐘催客睡酒樓戲鼓撓人詩幽燕尚在黄雲外僂指何時是到期次韻陳孝先制機論學名應子號月觀道人詞章記覽固虛文兀坐枯禪亦異聞萬事當如爐上雪一心莫起鏡中雲知行互進方為學理欲相參及早分吾道但從平實看求之空寂便紛紜寳應城北門外登崖散步夾道繁陰千步強支笻聊當踏春陽野花不識興亡事故故撩人為送香山陽寄陳月觀悤悤分手向天涯便憶髙齋聚首時遶榻圖書春睡醒一燈風雨夜談遲幽州此去三千里行客當歸六月期牎枕那堪秋思澹瀹茶細與説相思風㠶夜汎清河風飽晴川十幅蒲月眀乘興泛玻璃舟人生路須加謹却道今非比舊時舟次比屋當年圖上看中原欲渡長淮夢斷魂今日絶淮載詩去輕舟已自入桃源桃源縣過雀杼鎮即事草舎三家市蘆林半里城灘乾去船澁溪浄露沙眀鳥跡不見過蚌胎隨處生水心石人立遥望似相迎舟中與安道手談遣日日長消困共枰棋適興何須苦用機舟窄不妨眠對局暑輕已覺汗沾衣身如禪定一榻上心似遊絲千里飛何似清吟發天籟精神疎暢肉生肥夜泊宿遷上流舊國當年濶暑風今日生舟囘溪幾曲人卧月三更下邳永豐橋舟過其下有感下邳即下圯也博浪沙中擊副車却來跪履受編書欲從圯上尋黄石今有何人孺子如呂梁洪讀宣和碑水落石多舟去遲亂河西渡讀殘碑三亭二閘依然在那得安流似舊時彭城有感河邊不見舊黄樓緑暗荒城四月秋風捲黄沙塵拂面有人尚憶老坡不弔后山生平不肯見王公蒙被清吟道自尊寂寞彭城非昔比風流何處覔曾孫夜宿黄河輕舟自挽上危灘不見黄河古水津天上三更下弦月夢中萬里異鄉魂苦無濁酒澆勞役喜有清颷濯暑袢曉起掀篷眀望眼蹇驢載鵲過前村沛縣道中謾著青鞵過小灣偶然清暑變輕寒山行却似江南景更有羣鵝浴碧瀾漢髙祖歌風臺擊筑長歌意始真斬蛇元是感鄉人大風不起人非昔臺下滔滔泗水春沛城北有伍員廟碑露立荒郊有感呉若未亡齊未寒辭人微意寓毫端當時借為胥祠發似誚諸人訃契丹東行魚臺縣界初聞鶯時立夏八日新緑陰陰夏氣清犢車穿入别村行家山今隔幾千里始聽春鶯第一聲登魚臺讀唐梁至金人碑有感石臺突兀鎮荒雲廢寺淒涼石有文魯國遺風無彷彿矢魚以後幾紛紛眀發魚臺至古城或云即舊濟州未詳箕斗澄暉缺月升茅花夾轂雪中行曉風凛凛寒城冷濠裏荷錢無數生車行濟州道中即事客裏休歌行路難未容歸夢遶江南荆筐蔽弩人媒雉桃葉懸門女飯蠶故國山河今尚在殘春道路暑先酣新詩收拾中州事歸與鄉人細細談汶上縣西門外有梁王彦章廟金人泰和中重修廟記存鐡鎗戰死後梁時消得金人為葺祠近嵗江頭幾符節過來須也讀殘碑東平府登飛雲樓啜茶過樓懶上最髙梯為愛茶香試上嬉簷外衆山供逺碧却思鄉景下樓遲道過茌平縣感馬周事卧駕驢車入博州青山淡淡夕陽愁翻思故國今何在枉抱忠肝似馬周髙唐州戲作錯賦巫山十二峯西南與北偶名同便饒真是陽臺路行雨才收夢亦空道中不見山水有山無水山枯槁有水無山水汗漫此處無山亦無水風砂捲地鼻生酸過御河有感轉漕東南由汴力此河今日力猶多隋疲民力亡天下却為他人浚兩河景州道中驛路車聲軟斜暉雨脚收柳陰家曉鵲桑椹醉春鳩雄州北城外過白溝河手斧當年自畫河聖人微意不求多如何王蔡忘前事可謂貪他却著他道中渴水轆轤無處汲甘泉惱得相如肺疾生憶著江南山裏路時時一酌骨毛清曉入涿州界看太行山曉風刮骨似嚴寒漠漠吹沙塞鼻關卧入范陽元不覺醒來忽見太行山連日曉行就車擁衾不得卧處處風吹碧草生流星時渡絳河眀上車却欲補殘睡無數樹陰啼亂鶯宛平道中即事驚心卵石礙劈面老沙吹越見天濶處不見雲盡期入都門漫賦粉圍萬雉拱宸居新邑由來草創初省署朝衣雜貍鼠市㕓人跡混龍魚望時已近行難到在處皆寛住似疎草舞南風半黄碧客牕幽坐恰便書簡鄉人丘同知舜臣不愛一身死以全千里生羣言更廉潔此事甚分眀心白天應見官卑自莫争于公厚陰徳尚欲子孫榮見禮部尚書謝公昌言號敬齋蜀省魁曾將鴻筆冠羣英自是峨眉第一人執志只期東海死傷心老作北朝臣叔孫入漢儀方制箕子歸周範已陳闕正須自愛不貲身經行舊城過宣聖廟欲看石鼓不得入牆院人家少市聲髙槐古柳緑初新陰雲猶閣西山雨城郭常吹東海塵杏頰簪花紅照樹蟲絲羅巷晝窺人岐陽石鼓無由見深鎻儒宫碧草春端午辜負昌陽酒一盃異鄉節物苦相催榴花未見已夏半梅子空黄無雨來下士蜀皇不復産愛君屈子有餘哀江南儘自多魚米好趂涼風及早囘無題二首磵邊竹樹絶幽香燕坐雲根寫洞章馬上行人重囘首只知草軟卧牛羊海風吹上一天秋獨卧扁舟自在流傾盡酒壺人已醉却横長笛荻花洲上趙簽推二首名父由來産哲兒一門忠孝藹芳菲自從藩府馳朱轂久缺庭闈戲綵衣兵筦少淹當遂相樊川已得未容歸魯公居外周公内清夜相思魂夢飛公盡得杜牧樊川故墅浩然有歸志我本郎君屬部民今朝堂上拜靈椿閑閑而後無名手寂寂之餘有此人千里家書常訓子一言心事在禔身仙翁若問吾州政萬碧樓空不染塵閑閑中原故趙禮部有時名北方宗之家有萬碧樓夢斗曾為作賦富春方史君萬里與之别七年矣離亂之後不意得聚首於此一見道舊有感三首兩邊髯鬢雪交眀一笑何期在客京此㑹向來隨是夢相逢喜定却還驚清吟自足配嚴瀬𤣥英先生配食釣臺狂語常憂沈石城宗人台符事見江南野史我定先還故山去先生恰有北燕行少年紅燭照銀巵頗憶沙河共客衣今説宣威麟可佩争如華表鶴來歸秋香歙浦秔先熟春早祁山筍更肥茗飲蕭齋客見過舊遊談塵雪霏霏衣冠屈辱但長吁為笑吾徒事業迂無救於亡焉用相不知所任正非儒北方誤以逆賈為儒而亡國不知賈非儒也天初生摯意有謂人獨存箕道未孤迓續斯文難别諉願𢎞正學福寰區暑中謾説江南暑欝蒸渠知此處烈於焚團蠅對面如樓子蠆蚤侵肌似錦文病瘦帶圍寛一尺事荒才思退三分夢魂自有清涼處還看冰衣水皺裙書感驅馳萬里且歸休三十餘年只漫遊已死舒何呌不起霜松雪桂一山秋徽學近年惟舒公璘何公坦大有功於學夢斗在學時松桂甚茂今閫剪伐矣丘舜臣遣人還鄉托以家書時六月望因走筆寄主學胡君及士招學正諸同舎夢亦何曽渡白溝今朝却作等閒遊横雲鶴倦性猶野嘶雨蟬哀信已秋此事欲知詩儘有西園才説肺先浮歸途亦及中秋月乘興同登何處樓安道改授休寧尹令郎仲坦祁門尹再成小詩父子雙飛對對鳬弦歌聲接倚州閭身同華表歸家鶴夀介庭闈潑甕蛆薯斸率山寒玉挺筍披閶水小犀株羮餘親釡應分餉為攪饑腸幾巻書休寜山藥祁門竹萌皆吾邦珍味城中將相第宅樹之以木殊多茂盛因憶家園有賦屋頭花竹已成林奪與燕山萬里心帝里雖云多勝宅何須底事覔清陰七月五夜枕上漫作悲秋一首時痔下猶未愈楚客悲秋已自愁況於客病事悠悠金燈對我吟清夜苔研賺人空白頭猶許存名參釋老那知有道本伊周風翻木葉露初下笑指家林歸去休巧節新涼遡晩風一笑偶相同有景如荒野無雲障太空涓涓渠水緑樹樹蓼花紅星㑹俄已過風光歎轉蓬羈燕四十餘日歸興殊切口占賦歸八首朝來收拾掛風蒲肯效當年賤丈夫尚有耕廬寄汾曲豈無卜肆在成都荷移涼意歸紅蓼竹讓秋聲與碧梧寂寞南朝亡國恨當時為不用真儒水畔斜陽萬馬行柳邊殘雨一蟬鳴催人老去何忙甚覺我新來太瘦生不死雖然如管仲有生終是愧淵眀商颷愈𦂳歸心切莫把詩書博惡名士節陵夷久可憐謂宜作氣一時伸恰求諤諤廷中辯亦似厭厭泉下人身死首陽名不死家貧陋巷道非貧世推五運今何運歸去何如老海濵三間小屋枕山邊一縷沈烟謝老天康節雖貧猶自樂希夷當亂只髙眠道非日用常行外心在吾身未有前歸去重參教透徹何須更用羨神仙身到嬴秦古塞垣茫茫禹迹故皆存近來粤客通南貨舊日燕人祭北門治極漢唐猶駁雜功侔禹稷有根源紀綱法度於何是歸醉牀頭老瓦盆留連荒邸況栖栖席地跧蹲四體胝飲量素慳愁對酒殺機元淺倦招棋相傳帝統須求正莫使王風久下衰歸去林間洗雙眼暮年要看太平時世道茫茫未解憂新涼行色且歸休四年擾擾春如夢五袠駸駸老轉愁禹貢九州行半矣周家十亂有人不浣紗雲冷徽山月不佀林間樂一丘商量何必又商量休笑吾人議論長事欠剸裁多積壓心猶疑忌少擔當無由把袖舒衷憤空負懸弧射四方只恐秋風破茅屋急歸爛賞木犀香次韻效都堂薫風詩輕颷鼓入五弦琴都是重華育物心唐殿微涼只専嚮何如四海共清陰問候趙簽推龜疇五福屬鴻儒夀骨清強病應無要識維摩今示病當知洓水本來癯心從空想塵無染念到忘時氣自蘓此説雖非儒所道於中恐亦有工夫送江東李宣副之官建鄴田里創殘疚正深望醫起死息呻吟神功那用千金藥妙處都由一寸心劒外空遺喬木望江東將有憇棠陰十分存省新甿了歸轉洪鈞普作霖八月十四夜月食盡日陰雲蔽太虛夜深却見太陰虧老天故露妖蟇惡要索盧仝寸鐡詩寄安道世儒多誤入旁門黙坐求心謂道尊知不兼行無實力體非有用是空言窮探天命理為主盡得人彛性自存寄語寒氊分鄭老待提此話破昏昏風起揚埃如天舞巻地飛埃逐曉颷盤旋曲折勢飃䬙筵前舊説囘風舞今見娉婷楚女腰别左司杜郎中相見悤悤即吿歸江南魚米儘堪娯樹林浩有秋聲老客路誰憐月影孤班序自還君富貴齋居猶著已工夫他時重㑹無他説敢問於仁已近無左司有堂名近仁夢斗曾為作銘簡楊治中當年北騎壓杭城奮起渡江尋舊盟本擬鄭僑成好去寧知徐鉉播文名從班真是覺來夢别駕猶如退步行上介尚能分閫去不應班爵獨公輕别方萬里異鄉成邂逅却是受恩深白雪千絲髪青山一掬心夢殘横老淚悲極輒髙吟此意都相似鍾期合鑄金門外桑乾水我行君尚留話長見恨晚情苦意如秋此道今垂絶何人可與謀臨行重分首吾教尚多憂柯山趙公屢更麾節多在浙東西皆有美政徳祐正為浙東憲入景炎猶為閩浙招捕今被召入覲從行幕客則呉元鎮與朱景日武博景日向在上庠亦辱識此來所館相去差逺至是出舊城方能報元鎮謁併言别故就訪景日不遇却因得見招捕公䝉謙接元鎮訝其無詩為贄口占三首奉呈資一笑元鎮呉安朝景日朱升淒涼路入古神州況復驅車渡白溝蜀主未能重造漢商孫不免亦侯周九重注想聞猶吿五事開陳動冕旒耿耿胷中有餘意西山老碧不勝秋是日有㫖召對公上江南五事遺愛曾留浙水濆北方正自素相聞長途賡唱多名筆舊府賔僚盡富文往昔知音有呉季從來難吏是朱雲聨鑣向闕成嚴覲拜得恩言定不羣當年不得拜前呵相遇今時可奈何病骨已愁飛雪早衰年敢謂見天多既無上策裨朝論惟有東還聽壤歌出處從知元有分忍言兼善脱槃薖上故相留公蒼天有意不能違行邁心摇賦黍離弼既遭艱尋罷政質如在位必遲疑身逢今日多休問事在當年偶少思緣是庚申輕放入力争不似甲辰時眀倫一疏筆如椽痛掃凶邪四海傳故使北人騎屋望時聞南面獨班宣雖言上眷尤濃甚只著前衘固愴然舊日恩堂炊已熟夕陽敗柳奈號蟬公入朝不屈止稱前正奉大夫留示逯雲甫秀才萬里舟車要覔詩衰年忍負始來時未成班氏兩京賦僅見韓山一片碑歸信正須傳鴈帛秋風不為憶蓴絲今朝再渡桑乾水月朗風清誰繫思遺山諸老號儒宗竊與余懐正不同了得髙吟猶小技窮知實理是全功生民皆本詩書出宇宙元包性分中來此無人同我意拳拳望子革頺風遺山中原故詩人元好問也車出范陽界望太行已不見又别太行去征衫浥淚班仙游在北岳騷興滿西山世換碧如古雲收意佀閒闕雄州囘陽栁在城南郝庄有碑敗柳能消藥一圓鵝黄裊裊復春妍世間真有囘陽事却道枯骸不解僊連日車行風寒不奈淒風透敝裘髙眠車上被蒙頭自憐病骨生來弱莫恨客途寒可憂雅操素持四不出狂吟且和二冝休家鄉才喜清無暑露下芙蓉一院秋貝丘道中看王莽所塞黄河舊迹從來四瀆各入海㡳事黄河今亂淮新莽智欲出神禹坐令四瀆名實乖東平道中追思來途去時薫入五絃琴絃上繁陰暑氣侵寂寞荒村驚葉落又驅雙轂過龜陰九日前一日過東平城中見賣糕有感獵獵霜颷颭菊枝盤中粉餌趂時炊承平節物今猶見却憶劉郎舊欠詩汶陽重九燒燈纔了客天涯秋過重陽未到家自歎滿梳搔白髪不堪好酒對黄花折腰肯使羞元亮落帽多應罪孟嘉寂寞汶陽溪上路寒風拂柳晚陰斜濟州至魯橋鎮即事過了潘郎一句詩塗中風雨尚垂垂少人耕處地最濶多日陰時秋更悲山向近來青淡淡樹因逺看黒離離魯橋有水租船去眀眼先朝一片碑眀發魯橋鎮舟行泗水阻小艇孤汀恰水生來時孤汀無水舟故不至此一炊雲外熟雙櫂雨中行衣醭梅天潤蓬疎臘月清江南稍有侣鵲報曉來晴舟次耿山喜霽曉來乘雨過留城屈指徐州一百程到得耿山程已半雲收特地放新晴向曉風順掛帆頑陰破處見秋空十幅枯蒲飽晚風驚得野鳬連族起蓼花兩岸獻生紅睡中過彭城驚殘曉夢語啾啾頻喚移篙看石頭已過徐州元不覺依前不得上黄樓重題吕梁洪新安江最險此險越艱難亂石紛如錯涓流曲若環危争分寸地只在折旋間何佀平夷了輕舟利往還月夜舟行晚發吕梁洪下近更餘至雙溝熒起長庚落霽空秋意寛昏時金未落火已大眀火躔婁胃間金躔心尾間水光涵月白霜氣挾風寒舟取北為近川流泗最安鴈聲重嘹唳莫是夜將闌舟過桃源至下流近申刻舟人欲取小清河出淮謂可省路四十里既入小清河乘潮亟行舟去如駃次早已至山陽前來不得由捷徑今日才能據要津水趂晚潮勢殊順岸陳秋緑迹相親因知客路無多日喜到家時恰小春曉絶淮流却扶杖逢人便謂即鄉人易舟泛䢴溝有懐來塗過得淮來便是家沿流草樹尚芳華幽燕囘首黄雲外想見寒風舞雪花維揚見陳孝先制機辱授館因呈小詩見意倦客秋帆歸較遲亦聞采藻魯侯池不煩下榻眠髙士寧復登樓卧小兒病菊耐霜癯佀我寒風吹面鬢如絲君非能出不能處心事相同因得知呈隆興總管王都水友直南朝舊名族貴盛數諸王亡國恨何極餘生計尚長風流豫章守人物水曹郎客裏吟尤苦秋江卧夕陽當日鳯臺下鹿鳴同著鞭魚龍既懸絶鷄犬竟難仙危葉愁霜病寒花紛晚妍幽牕論舊事客抱固淒然揚子橋又撑舴艋下䢴溝霽色横空宿雨收已入伊婁河裏去來朝穏穏飯真州渡江至龍潭即事敗蘆衰柳落江隈才見黄雲接畮堆舟趂瀾狂斜入浦帆因風飽不依桅青山數閲世興廢白鳥静窺人去來地暖江南未吹雪小春天氣正尋梅竹篠村店肆筆西望武昌東夏口下窺鐵甕固依然英雄争戰幾編史狂客浮遊一葉船把酒臨風懐古處題詩記我過江年謾言足跡半天下未必詩名所在傳上宣副定甫十二韻建鄴古都㑹東南氣勢雄宣流分漢使禮樂有周公自是通儒術元非急治功一江秋色外九郡月眀中雲澤遍田里聲華徹昊穹藩方小盤薄廊廟即春容力可安燕祚學能傳孔宗經綸方寸起勲徳古人同妄息五官寂靈存萬慮空井寒那起浪木静不驚風定者心之主行兮用以充蒼生望霖雨寧久蟄泥龍送宗人熈甫入都栖栖我輩只如斯壯矣如君百倍宜若是胷襟合西豹未應位置下丘遲二姓借用丘遲指舜臣波涵鴈影日欲落霜浄蟬枝風亂吹一路盡皆懐古處任城多有漢時碑登雨華臺讀馬華國碑寒江如夢夕陽斜休笑諸賢誤晉家雨打風吹碑已泐英辭空自雨天華呈金陵教授陳宜之鉞前進士三人居慈湖文物依然故燕園扶持云是有師門闕花似醒醉夫夢頖藻如招騷客魂門户固緣太丘重鄉人素仰后山尊曹溪一滴西江漲欲乞開堂舊偈翻題鄉友葉景星號洪堂因所居之村而名心胷欲閎肆意氣要恢張力可𢎞吾道方能大此堂簾開一作寛容燕入庭濶受花香於以警為學非惟志故鄉當塗轎行口占筍輿咿􅥆亂山隈擁鼻清吟當探梅我已少知憂責少人皆喜慰逺鄉囘樹猶緑暗知霜薄雲漸紅深欲雪來自説江南好風景江南尤更有竒才南園歌傷呉履齋舊景寂寞南園今如此主人一斥循州死南園如此未足悲宗周隨歌黍離離丞相當年坐黄閣正是北兵渡荆鄂不知宣閫有何功却以鈞軸遜狡童丞相身謀固已失坐此謀失亡人國梅花嶺外羈魂哀薊門降王亦再來南園池館不佀舊百花憔悴竹樹瘦不堪囘首望錢塘宫闕傾頺禁苑荒鄙夫姦人如王蔡又無惠卿才可愛丞相有見非不長而乃升之中書堂我行南園淚雨下不免寒心怒欲罵不特要寫平泉詩更復要草連宫辭嗚呼呉丞相手提雙筆巖廊上藝皇有訓垂日星非讀書人毋用相博飲好色不肖子可以公台作邊賞履翁之計早出此老骨不死椒花瘴西湖一碧無片塵南園花草千年春右履翁再相力言姦邪誤國數事請必行之理皇竟不能平㑹似道以江上肅清之報徑達禁中上遂罷濳相眀日乃以似道奏付外然則似道之相豈履翁意哉余所聞如此因書於此雨中曉行馬上鷄聲黄葉村擁衾人卧閉柴門征裘塵土休煩洗留取燈前看涴痕寧川道中口占緩兀吟鞍去鞭長袖裏垂烟分村逺近水見地髙卑風𦂳鳥飛疾川寒魚上遲擁爐闕雪久已數歸期入叢山隘見雪天公有意相歸程曉起千峯照眼眀一白自能遮百醜只疑風味太清生詩餘南鄉子初入都門謾賦西北有神州曾倚斜陽江上樓目斷淮南山一抹何由載淚東風灑汴流何事却狂遊直駕驢車渡白溝自古幽燕為絶塞休愁未是窮荒天盡頭朝中措客邸有感人言樓觀似蓼陽巍倚太清旁便有二京賦手也費力鋪張客牕夢斷星稀月澹一枕淒涼舊日春風汴水多少垂楊人月圓尋常一樣牕前月人只看中秋年年今夜争尋詩酒共上髙樓一奩眀鏡能圓幾度白了人頭良辰美景賞心樂事輸少年遊金縷曲月夕賦前詞書畢愴然有感再賦此滿目飛眀鏡憶年時呼朋樓上暢懐觴詠圓到今宵依前好詩酒不成佳興身恰在燕臺天子一段淒涼心中事被秋光照破無餘藴却不是訴貧病宫庭花草埋幽徑想夜深女牆還有過來蟾影千古詞人傷情處舊説石城形勝今又説斷橋風韻客裏嬋娟却相佀只後朝不見潮來信且喜得四邊静摸魚兒過東平有感憶舊時東方郡東原儘是佳處梁都破了尋南渡幾遍狐號鱔舞君試覷環一抺荒城草色今如許芳華舊地曾一上飛雲歌臺酒館落日亂鵶度吟情苦滴盡英雄老淚淒酸非是兒女西湖似我西湖否只怕不如西子秋欲暮要一看秋波又自催歸計休浪語待過江説與髙車駟馬今是朝天路憶古揚州賀宗人熈甫赴任選得官歸黄埃滿面難於奏賦眀光殿秋帆落日渡淮來三杯酒濁憑誰勸舊日佳詞自吟一遍緑袍不是嫦娥剪紅樓十里古揚州無人為把朱簾捲北遊集巻上
